<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pothole Detector</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <div class="container">

        <h1>Pothole Detector</h1>

        <p class="subtitle">
            Upload a road image to detect potholes
        </p>


        <!-- Image upload -->

        <input
            type="file"
            id="imageInput"
            accept=".jpg,.jpeg,.png"
        >


        <!-- Image preview -->

        <div class="preview-container">

            <img
                id="preview"
                alt="Image preview"
            >

        </div>


        <!-- Detect button -->

        <button
            id="detectButton"
            onclick="uploadImage()"
        >
            Detect Potholes
        </button>


        <!-- Loading message -->

        <p id="loading"></p>


        <!-- Result -->

        <h2 id="result"></h2>

    </div>


    <script src="/static/script.js"></script>

</body>

</html>
